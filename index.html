<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eyosiyas Desta | Frontend & Software Developer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel for instant browser execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    .bg-radial-gradient {
      background: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [copiedEmail, setCopiedEmail] = useState(false);
      const [formStatus, setFormStatus] = useState(null);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, []);

      const copyEmail = () => {
        navigator.clipboard.writeText("contact@eyosiyasdesta.me");
        setCopiedEmail(true);
        setTimeout(() => setCopiedEmail(false), 2000);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        setFormStatus('Message sent! (Sample demonstration)');
        setTimeout(() => setFormStatus(null), 4000);
      };

      const skills = [
        { name: "React.js", category: "Frontend" },
        { name: "JavaScript (ES6+)", category: "Language" },
        { name: "Tailwind CSS", category: "Styling" },
        { name: "HTML5 & Modern CSS", category: "Frontend" },
        { name: "Git & GitHub", category: "Version Control" },
        { name: "RESTful APIs", category: "Architecture" },
        { name: "Responsive Design", category: "UI / UX" },
        { name: "Node.js Basics", category: "Backend" }
      ];

      const projects = [
        {
          title: "Personal Portfolio & Showcase",
          description: "A fast, fully responsive portfolio deployed on GitHub Pages with a custom domain, showcasing modern React design patterns and component architecture.",
          tags: ["React", "JavaScript", "Tailwind CSS", "GitHub Pages"],
          github: "https://github.com/eyosiyasdesta/eyosiyasdesta.github.io",
          live: "https://eyosiyasdesta.me"
        },
        {
          title: "Interactive Web Application",
          description: "Sample frontend web app featuring dynamic state management, API consumption, filterable lists, and theme switching.",
          tags: ["JavaScript", "React", "REST API", "Tailwind"],
          github: "https://github.com/eyosiyasdesta",
          live: "#"
        },
        {
          title: "UI Component Library & Dashboard",
          description: "Collection of clean, accessible UI components including charts, modals, data tables, and notification systems.",
          tags: ["React", "CSS Modules", "Accessible UI"],
          github: "https://github.com/eyosiyasdesta",
          live: "#"
        }
      ];

      return (
        <div className="relative overflow-hidden">
          {/* Subtle Ambient Glow */}
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-[600px] bg-radial-gradient pointer-events-none -z-10"></div>

          {/* Navigation Bar */}
          <nav className="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
            <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
              <a href="#" className="text-xl font-bold tracking-tight text-white flex items-center gap-2 group">
                <span className="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-black text-sm group-hover:scale-105 transition-transform">
                  ED
                </span>
                <span>Eyosiyas<span className="text-brand-400">.me</span></span>
              </a>

              <div className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-300">
                <a href="#about" className="hover:text-white transition">About</a>
                <a href="#skills" className="hover:text-white transition">Skills</a>
                <a href="#projects" className="hover:text-white transition">Projects</a>
                <a href="#contact" className="hover:text-white transition">Contact</a>
              </div>

              <div className="flex items-center gap-3">
                <a
                  href="https://github.com/eyosiyasdesta"
                  target="_blank"
                  className="px-3.5 py-1.5 rounded-lg border border-slate-700 hover:border-slate-500 bg-slate-900 text-xs font-semibold hover:bg-slate-800 transition flex items-center gap-2"
                >
                  <i data-lucide="github" className="w-4 h-4"></i>
                  <span>GitHub</span>
                </a>
              </div>
            </div>
          </nav>

          {/* Hero Section */}
          <section id="about" className="max-w-6xl mx-auto px-6 pt-24 pb-20 md:pt-32 md:pb-28">
            <div className="max-w-3xl">
              <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-semibold mb-6">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Open to internships & developer opportunities
              </div>

              <h1 className="text-4xl sm:text-6xl font-extrabold tracking-tight text-white mb-6 leading-tight">
                Building modern web apps with <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-400 via-indigo-300 to-emerald-400">React & JavaScript</span>.
              </h1>

              <p className="text-lg text-slate-400 mb-8 leading-relaxed">
                Hi, I'm <strong className="text-slate-200">Eyosiyas Desta</strong>. I am a passionate developer focused on crafting responsive, clean web experiences. Welcome to my personal domain and portfolio sample.
              </p>

              <div className="flex flex-wrap items-center gap-4">
                <a
                  href="#projects"
                  className="px-6 py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm shadow-lg shadow-brand-500/25 transition flex items-center gap-2"
                >
                  <span>Explore Projects</span>
                  <i data-lucide="arrow-right" className="w-4 h-4"></i>
                </a>
                <button
                  onClick={copyEmail}
                  className="px-6 py-3 rounded-xl border border-slate-800 bg-slate-900/60 hover:bg-slate-800 text-slate-300 hover:text-white font-medium text-sm transition flex items-center gap-2"
                >
                  <i data-lucide={copiedEmail ? "check" : "mail"} className="w-4 h-4 text-brand-400"></i>
                  <span>{copiedEmail ? "Email Copied!" : "Copy Email"}</span>
                </button>
              </div>
            </div>
          </section>

          {/* Skills Section */}
          <section id="skills" className="border-t border-slate-800/80 bg-slate-900/30 py-20">
            <div className="max-w-6xl mx-auto px-6">
              <div className="mb-12">
                <h2 className="text-xs font-bold uppercase tracking-widest text-brand-400 mb-2">Capabilities</h2>
                <p className="text-3xl font-bold text-white tracking-tight">Technologies & Skills</p>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                {skills.map((skill, idx) => (
                  <div
                    key={idx}
                    className="p-4 rounded-xl border border-slate-800 bg-slate-900/40 hover:border-brand-500/40 hover:bg-slate-900/80 transition-all group"
                  >
                    <div className="text-xs font-medium text-slate-500 mb-1">{skill.category}</div>
                    <div className="text-base font-semibold text-slate-200 group-hover:text-white transition">
                      {skill.name}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Featured Projects Section */}
          <section id="projects" className="py-24">
            <div className="max-w-6xl mx-auto px-6">
              <div className="flex flex-col md:flex-row md:items-end justify-between mb-12 gap-4">
                <div>
                  <h2 className="text-xs font-bold uppercase tracking-widest text-brand-400 mb-2">Portfolio</h2>
                  <p className="text-3xl font-bold text-white tracking-tight">Featured Projects</p>
                </div>
                <p className="text-sm text-slate-400 max-w-md">
                  A collection of sample applications showing frontend engineering, clean components, and practical web solutions.
                </p>
              </div>

              <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                {projects.map((proj, idx) => (
                  <div
                    key={idx}
                    className="flex flex-col justify-between p-6 rounded-2xl border border-slate-800 bg-slate-900/50 hover:border-slate-700 transition"
                  >
                    <div>
                      <div className="flex items-center justify-between gap-2 mb-4">
                        <span className="text-xs font-mono text-slate-500">0{idx + 1}</span>
                        <div className="flex items-center gap-2">
                          <a
                            href={proj.github}
                            target="_blank"
                            className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                            title="GitHub Source"
                          >
                            <i data-lucide="github" className="w-4 h-4"></i>
                          </a>
                          {proj.live !== "#" && (
                            <a
                              href={proj.live}
                              target="_blank"
                              className="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition"
                              title="Live Demo"
                            >
                              <i data-lucide="external-link" className="w-4 h-4"></i>
                            </a>
                          )}
                        </div>
                      </div>

                      <h3 className="text-lg font-bold text-white mb-2">{proj.title}</h3>
                      <p className="text-sm text-slate-400 mb-6 leading-relaxed">
                        {proj.description}
                      </p>
                    </div>

                    <div className="flex flex-wrap gap-1.5 pt-4 border-t border-slate-800/80">
                      {proj.tags.map((tag, tIdx) => (
                        <span
                          key={tIdx}
                          className="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-slate-300"
                        >
                          {tag}
                        </span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* Contact Section */}
          <section id="contact" className="border-t border-slate-800/80 bg-slate-900/30 py-24">
            <div className="max-w-4xl mx-auto px-6">
              <div className="text-center mb-12">
                <h2 className="text-xs font-bold uppercase tracking-widest text-brand-400 mb-2">Get in touch</h2>
                <p className="text-3xl font-bold text-white tracking-tight mb-4">Let's Connect</p>
                <p className="text-slate-400 text-sm max-w-md mx-auto">
                  Have a question, an opportunity, or want to collaborate? Send a message below or reach out directly.
                </p>
              </div>

              <div className="max-w-md mx-auto p-8 rounded-2xl border border-slate-800 bg-slate-900/80 shadow-2xl">
                <form onSubmit={handleFormSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Your Name</label>
                    <input
                      type="text"
                      required
                      placeholder="Jane Doe"
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Your Email</label>
                    <input
                      type="email"
                      required
                      placeholder="jane@example.com"
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 text-sm"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-400 mb-1">Message</label>
                    <textarea
                      rows="4"
                      required
                      placeholder="Hi Eyosiyas, I wanted to reach out regarding..."
                      className="w-full px-4 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 text-sm resize-none"
                    ></textarea>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-medium text-sm transition shadow-lg shadow-brand-500/20"
                  >
                    Send Message
                  </button>
                  {formStatus && (
                    <div className="p-3 text-center text-xs text-emerald-400 bg-emerald-950/40 border border-emerald-800/40 rounded-lg">
                      {formStatus}
                    </div>
                  )}
                </form>
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-8 text-center text-xs text-slate-500">
            <div className="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                © {new Date().getFullYear()} Eyosiyas Desta • <a href="https://eyosiyasdesta.me" className="text-brand-400 hover:underline">eyosiyasdesta.me</a>
              </div>
              <div className="flex items-center gap-4">
                <a href="https://github.com/eyosiyasdesta" target="_blank" className="hover:text-slate-300 transition">GitHub</a>
                <a href="#about" className="hover:text-slate-300 transition">Back to Top ↑</a>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
